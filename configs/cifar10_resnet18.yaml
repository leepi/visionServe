model:
  backbone: resnet18
  num_classes: 10
  pretrained: true
  dropout: 0.1

data:
  dataset: cifar10
  data_dir: ./data
  image_size: 224
  batch_size: 128
  num_workers: 4
  val_split: 0.0

train:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  label_smoothing: 0.1
  grad_clip: 1.0
  seed: 42
  device: auto
  output_dir: ./checkpoints
  log_dir: ./runs
  early_stopping_patience: 5
  save_best_only: true

class_names:
  - airplane
  - automobile
  - bird
  - cat
  - deer
  - dog
  - frog
  - horse
  - ship
  - truck
