[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionserve"
version = "0.1.0"
description = "Production-ready image classification API with PyTorch and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VisionServe Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.19",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "types-PyYAML",
]
train = [
    "tensorboard>=2.15",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.scripts]
visionserve-train = "visionserve.train:main"
visionserve-eval = "visionserve.evaluate:main"
visionserve-api = "visionserve.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/visionserve"]
omit = ["*/tests/*", "*/__init__.py"]
